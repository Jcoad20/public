<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>3D 玻璃机器人 · 1:1 复刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#7fe7f2;
  --cyan-strong:#bff6ff;
  --cyan-dim:rgba(127,231,242,.38);
  --bg0:#1b2126;
  --bg1:#0e1114;
  --ink:#8fa3ad;
}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 50% 38%, var(--bg0) 0%, #14181c 55%, var(--bg1) 100%);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
#stage{position:fixed;inset:0}
#stage canvas{display:block}

.hud{position:fixed;z-index:5;pointer-events:none;user-select:none}
.hud-tl{top:30px;left:34px}
.hud-tl .kicker{
  font-family:"Michroma",sans-serif;
  font-size:10px;letter-spacing:.42em;color:var(--cyan);
  opacity:.85;margin-bottom:10px;
}
.hud-tl h1{
  font-size:20px;font-weight:500;color:#d9e6ea;letter-spacing:.14em;line-height:1.5;
}
.hud-tl h1 span{
  font-family:"Michroma",sans-serif;font-size:13px;letter-spacing:.3em;
  color:var(--cyan);display:block;margin-top:4px;
}
.hud-tr{top:32px;right:34px;text-align:right;font-size:11px;letter-spacing:.22em;line-height:2;opacity:.72}
.hud-tr b{color:var(--cyan);font-weight:500}

.hud-b{left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 20px}
.chip{
  font-size:11px;letter-spacing:.26em;padding:7px 14px 7px 16px;
  border:1px solid rgba(127,231,242,.22);border-radius:999px;
  background:rgba(14,20,24,.42);backdrop-filter:blur(6px);
  color:#a9c3cb;
}
.chip.glow{border-color:rgba(127,231,242,.5);color:var(--cyan)}
.chip.dim{opacity:.6;border-style:dashed}

.corner{position:fixed;width:26px;height:26px;z-index:4;pointer-events:none;opacity:.5}
.c-tl{top:16px;left:16px;border-top:1px solid var(--cyan-dim);border-left:1px solid var(--cyan-dim)}
.c-tr{top:16px;right:16px;border-top:1px solid var(--cyan-dim);border-right:1px solid var(--cyan-dim)}
.c-bl{bottom:16px;left:16px;border-bottom:1px solid var(--cyan-dim);border-left:1px solid var(--cyan-dim)}
.c-br{bottom:16px;right:16px;border-bottom:1px solid var(--cyan-dim);border-right:1px solid var(--cyan-dim)}

#boot{
  position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:18px;
  align-items:center;justify-content:center;
  background:radial-gradient(900px 620px at 50% 42%, #161c21 0%, #0d1013 100%);
  transition:opacity .9s ease;
}
#boot.hide{opacity:0;pointer-events:none}
#boot .ring{
  width:54px;height:54px;border-radius:50%;
  border:1px solid rgba(127,231,242,.2);border-top-color:var(--cyan);
  animation:spin 1.1s linear infinite;
}
#boot p{font-family:"Michroma",sans-serif;font-size:10px;letter-spacing:.5em;color:var(--cyan);opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#boot .ring{animation:none}}
@media (max-width:640px){
  .hud-tr{display:none}
  .hud-tl h1{font-size:16px}
  .chip{font-size:10px;letter-spacing:.18em}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<header class="hud hud-tl">
  <div class="kicker">SVG &rarr; WEBGL &middot; PHYSICAL GLASS</div>
  <h1>机器人吉祥物 &middot; 三维玻璃复刻 <span>GLASS&nbsp;UNIT&nbsp;/&nbsp;1:1</span></h1>
</header>

<div class="hud hud-tr">
  TRANSMISSION <b>0.93</b><br/>
  IOR <b>1.45</b> &middot; CLEARCOAT <b>1.0</b><br/>
  ORBIT&nbsp;RING <b>ACTIVE</b>
</div>

<footer class="hud hud-b">
  <span class="chip glow">左右摇头</span>
  <span class="chip glow">眼睛呼吸发光</span>
  <span class="chip glow">身体悬浮</span>
  <span class="chip">耳朵 &middot; 光环旋转</span>
  <span class="chip">粒子漂浮闪烁</span>
  <span class="chip dim">拖拽旋转 &middot; 滚轮缩放</span>
</footer>

<div class="corner c-tl"></div><div class="corner c-tr"></div>
<div class="corner c-bl"></div><div class="corner c-br"></div>

<div id="boot"><div class="ring"></div><p>GLASS CORE BOOTING</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const S = 0.01;
const px = x => (x - 450) * S;
const py = y => (470 - y) * S;
const HEAD_PIVOT = py(514);
const hy = y => py(y) - HEAD_PIVOT;
const deg = THREE.MathUtils.degToRad;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(512, 430, 60, 512, 430, 780);
  grad.addColorStop(0, '#242c33');
  grad.addColorStop(.45, '#161b20');
  grad.addColorStop(1, '#0b0e11');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(
    new THREE.SphereGeometry(12, 32, 24),
    new THREE.MeshBasicMaterial({ color: 0x030608, side: THREE.BackSide })
  ));
  const panel = (w, h, pos, c) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
    m.position.copy(pos);
    m.lookAt(0, 0, 0);
    envScene.add(m);
  };
  panel(7, 3, new THREE.Vector3(-4, 7, 4), new THREE.Color(6, 6.4, 6.6));
  panel(1.2, 8, new THREE.Vector3(8, 1, 3), new THREE.Color(2.2, 3.0, 3.2));
  panel(1.0, 6, new THREE.Vector3(-8, 0, -2), new THREE.Color(1.2, 2.2, 2.4));
  panel(6, 2, new THREE.Vector3(0, -6, 5), new THREE.Color(0.3, 0.8, 0.9));
  panel(10, 6, new THREE.Vector3(0, 2.5, 10), new THREE.Color(0.6, 0.65, 0.7));
  scene.environment = pmrem.fromScene(envScene, 0.05).texture;
}

const CAM_DIST = 16.8;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.15, CAM_DIST);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.2, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 30;
controls.minPolarAngle = Math.PI * 0.08;
controls.maxPolarAngle = Math.PI * 0.88;

const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.09,
  transmission: 0.93, ior: 1.45, thickness: 1.5,
  clearcoat: 1, clearcoatRoughness: 0.06,
  attenuationColor: new THREE.Color('#e8fbff'), attenuationDistance: 5,
  envMapIntensity: 1.2
});
const matVisor = new THREE.MeshPhysicalMaterial({
  color: 0x0b161c, metalness: 0, roughness: 0.1,
  transmission: 0.12, ior: 1.5, thickness: 1.0,
  clearcoat: 1, clearcoatRoughness: 0.08,
  specularIntensity: 0.5,
  envMapIntensity: 0.5
});
const matBody = new THREE.MeshPhysicalMaterial({
  color: 0x143441, metalness: 0, roughness: 0.14,
  transmission: 0.62, ior: 1.45, thickness: 1.8,
  clearcoat: 0.7, clearcoatRoughness: 0.2,
  attenuationColor: new THREE.Color('#0b1a21'), attenuationDistance: 1.6,
  envMapIntensity: 1.0
});
const matDark = new THREE.MeshStandardMaterial({ color: 0x0e1a20, roughness: 0.4, metalness: 0.25 });
const matDark2 = new THREE.MeshStandardMaterial({ color: 0x101c23, roughness: 0.38, metalness: 0.25 });
const matPale = new THREE.MeshStandardMaterial({ color: 0xcfeff5, emissive: new THREE.Color('#9fdfe8'), emissiveIntensity: 0.2, roughness: 0.35 });

function glowMat(hex, intensity) {
  return new THREE.MeshStandardMaterial({
    color: 0x06252b, emissive: new THREE.Color(hex), emissiveIntensity: intensity, roughness: 0.45
  });
}
function softLine(hex, opacity) {
  const m = glowMat(hex, 1.0);
  m.transparent = true;
  m.opacity = opacity;
  return m;
}

const ringMat = glowMat('#a5f3fc', 1.1);
const rimMat = glowMat('#22d3ee', 1.3);
const coreRingMat = glowMat('#8ff0fa', 1.8);
const coreMat = glowMat('#bff6ff', 2.4);
const cyanGlow = glowMat('#67e8f9', 1.2);

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const hw = w / 2, hh = h / 2;
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh);
  s.absarc(hw - r, -hh + r, r, -Math.PI / 2, 0, false);
  s.lineTo(hw, hh - r);
  s.absarc(hw - r, hh - r, r, 0, Math.PI / 2, false);
  s.lineTo(-hw + r, hh);
  s.absarc(-hw + r, hh - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-hw, -hh + r);
  s.absarc(-hw + r, -hh + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
function roundedRectVecs(w, h, r, seg = 12) {
  const pts = [];
  const hw = w / 2, hh = h / 2;
  const corners = [[hw - r, hh - r, 0], [-hw + r, hh - r, Math.PI / 2], [-hw + r, -hh + r, Math.PI], [hw - r, -hh + r, Math.PI * 1.5]];
  for (const [cx, cy, a0] of corners)
    for (let i = 0; i <= seg; i++) {
      const a = a0 + (Math.PI / 2) * i / seg;
      pts.push(new THREE.Vector3(cx + r * Math.cos(a), cy + r * Math.sin(a), 0));
    }
  return pts;
}
function tubeFromPoints(pts, radius, mat, closed = false) {
  const curve = new THREE.CatmullRomCurve3(pts, closed, 'catmullrom', 0.1);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(48, pts.length * 6), radius, 12, closed), mat);
}
function cubicPts(x0, y0, x1, y1, x2, y2, x3, y3, n = 18) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, it = 1 - t;
    out.push(new THREE.Vector3(
      (it ** 3 * x0 + 3 * it * it * t * x1 + 3 * it * t * t * x2 + t ** 3 * x3) * 1 - 450,
      470 - (it ** 3 * y0 + 3 * it * it * t * y1 + 3 * it * t * t * y2 + t ** 3 * y3),
      0
    ).multiplyScalar(S));
  }
  return out;
}
function quadPts(x0, y0, cx, cy, x1, y1, n = 14) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, it = 1 - t;
    out.push(new THREE.Vector3(
      px(it * it * x0 + 2 * it * t * cx + t * t * x1),
      py(it * it * y0 + 2 * it * t * cy + t * t * y1),
      0
    ));
  }
  return out;
}

const robot = new THREE.Group();
scene.add(robot);

const headGroup = new THREE.Group();
headGroup.position.y = HEAD_PIVOT;
robot.add(headGroup);

const helmet = new THREE.Mesh(new THREE.SphereGeometry(1, 72, 48), matGlass);
helmet.scale.set(2.15, 2.0, 1.75);
helmet.position.set(0, hy(330), 0);
headGroup.add(helmet);

const visorGeo = new THREE.ExtrudeGeometry(roundedRectShape(3.0, 2.4, 0.92), {
  depth: 0.34, bevelEnabled: true, bevelThickness: 0.17, bevelSize: 0.14, bevelSegments: 8, curveSegments: 36
});
visorGeo.translate(0, 0, -0.17);
const visor = new THREE.Mesh(visorGeo, matVisor);
visor.position.set(0, hy(350), 1.18);
headGroup.add(visor);

const HELMET_CY = hy(330);
function surfZ(x, y) {
  const v = 1 - (x / 2.15) ** 2 - ((y - HELMET_CY) / 2.0) ** 2;
  return 1.75 * Math.sqrt(Math.max(v, 0.03)) + 0.05;
}

const rimPts = roundedRectVecs(3.0, 2.4, 0.92).map(p => new THREE.Vector3(p.x, p.y + hy(350), 0));
const rim = tubeFromPoints(rimPts, 0.042, rimMat, true);
rim.position.z = 1.56;
headGroup.add(rim);

const dimEyeMat = new THREE.MeshStandardMaterial({ color: 0x8fa3ad, emissive: new THREE.Color('#e8fdff'), emissiveIntensity: 0.4, roughness: 0.5 });

const leftEye = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 32), dimEyeMat);
leftEye.scale.set(0.16, 0.23, 0.06);
leftEye.position.set(px(352), hy(356), surfZ(px(352), hy(356)));
headGroup.add(leftEye);

const oCx = px(523), oCy = hy(360);
const rightEye = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 32), dimEyeMat);
rightEye.scale.set(0.20, 0.20, 0.06);
rightEye.position.set(oCx, oCy, surfZ(oCx, oCy));
headGroup.add(rightEye);

const oPts = [];
for (let i = 0; i <= 72; i++) {
  const a = i / 72 * Math.PI * 2;
  const x = oCx + Math.cos(a) * 0.38, y = oCy + Math.sin(a) * 0.38;
  oPts.push(new THREE.Vector3(x, y, surfZ(x, y)));
}
const eyeRing = tubeFromPoints(oPts, 0.045, ringMat, true);
headGroup.add(eyeRing);

{
  const segs = [
    [470, 322, 462, 310, 436, 306, 422, 316],
    [422, 316, 406, 327, 406, 346, 422, 354],
    [422, 354, 434, 360, 452, 360, 464, 368],
    [464, 368, 480, 378, 478, 398, 460, 406],
    [460, 406, 444, 413, 420, 410, 410, 398]
  ];
  const pts = [];
  for (const s of segs) pts.push(...cubicPts(s[0], s[1], s[2], s[3], s[4], s[5], s[6], s[7], 12));
  for (const p of pts) {
    p.y -= HEAD_PIVOT;
    p.z = surfZ(p.x, p.y);
  }
  const spiral = tubeFromPoints(pts, 0.04, ringMat, false);
  headGroup.add(spiral);
  for (const e of [pts[0], pts[pts.length - 1]]) {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 12), ringMat);
    cap.position.copy(e);
    headGroup.add(cap);
  }
}

const topRing = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.012, 10, 48), softLine('#67e8f9', 0.4));
topRing.scale.y = 0.29;
topRing.position.set(0, hy(272), surfZ(0, hy(272)));
headGroup.add(topRing);
const topNotch = new THREE.Mesh(new RoundedBoxGeometry(0.12, 0.16, 0.06, 3, 0.025), matPale);
topNotch.position.set(0, hy(260), surfZ(0, hy(260)));
headGroup.add(topNotch);
const botRing = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.012, 10, 48), softLine('#67e8f9', 0.4));
botRing.scale.y = 0.29;
botRing.position.set(0, hy(432), surfZ(0, hy(432)));
headGroup.add(botRing);
const botNotch = new THREE.Mesh(new RoundedBoxGeometry(0.12, 0.16, 0.06, 3, 0.025), matPale);
botNotch.position.set(0, hy(422), surfZ(0, hy(422)));
headGroup.add(botNotch);

const chinPts = quadPts(292, 452, 450, 548, 608, 452).map(p => {
  const y = p.y - HEAD_PIVOT;
  return new THREE.Vector3(p.x, y, surfZ(p.x, y));
});
const chin = tubeFromPoints(chinPts, 0.014, softLine('#7fe7f2', 0.08), false);
headGroup.add(chin);

function earDisc(r, h, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48), mat);
  m.rotation.x = Math.PI / 2;
  return m;
}

const leftEar = new THREE.Group();
leftEar.position.set(px(238), hy(352), 0);
leftEar.add(earDisc(0.46, 0.14, matDark2));
const leRim = new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.015, 10, 64), cyanGlow);
leRim.position.z = 0.07;
leftEar.add(leRim);
const leInner = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.012, 10, 48), softLine('#67e8f9', 0.6));
leInner.position.z = 0.075;
leftEar.add(leInner);
headGroup.add(leftEar);

const rightEar = new THREE.Group();
rightEar.position.set(px(668), hy(352), 0);
rightEar.add(earDisc(0.58, 0.16, matDark2));
const reRim = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.018, 10, 64), cyanGlow);
reRim.position.z = 0.08;
rightEar.add(reRim);
const dashRing = new THREE.Group();
for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2;
  const d = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.028, 0.03), softLine('#67e8f9', 0.7));
  d.position.set(Math.cos(a) * 0.47, Math.sin(a) * 0.47, 0.085);
  d.rotation.z = a + Math.PI / 2;
  dashRing.add(d);
}
rightEar.add(dashRing);
const reGlow = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.03, 14, 64), glowMat('#7fe7f2', 1.8));
reGlow.position.z = 0.09;
rightEar.add(reGlow);
const reCore = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 32), matDark);
reCore.rotation.x = Math.PI / 2;
reCore.position.z = 0.09;
rightEar.add(reCore);
const reCoreRim = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.012, 10, 40), ringMat);
reCoreRim.position.z = 0.145;
rightEar.add(reCoreRim);
headGroup.add(rightEar);

const neck = new THREE.Mesh(new RoundedBoxGeometry(0.28, 0.30, 0.24, 3, 0.06), matDark);
neck.position.set(0, py(531), 0);
robot.add(neck);

const torsoGeo = new THREE.ExtrudeGeometry(roundedRectShape(1.44, 1.12, 0.42), {
  depth: 0.5, bevelEnabled: true, bevelThickness: 0.18, bevelSize: 0.15, bevelSegments: 8, curveSegments: 32
});
torsoGeo.translate(0, 0, -0.25);
const torso = new THREE.Mesh(torsoGeo, matBody);
torso.position.set(0, py(596), 0);
robot.add(torso);
const TORSO_FRONT = 0.5;

const torsoLineTop = tubeFromPoints(quadPts(392, 566, 450, 548, 508, 566), 0.012, softLine('#67e8f9', 0.4), false);
torsoLineTop.position.z = TORSO_FRONT;
robot.add(torsoLineTop);
const torsoLineBot = tubeFromPoints(quadPts(392, 622, 450, 640, 508, 622), 0.012, softLine('#67e8f9', 0.4), false);
torsoLineBot.position.z = TORSO_FRONT;
robot.add(torsoLineBot);

for (const sx of [382, 518]) {
  const j = new THREE.Mesh(new THREE.SphereGeometry(0.07, 24, 18), cyanGlow);
  j.position.set(px(sx), py(556), 0.2);
  robot.add(j);
}

const coreRing = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.028, 14, 48), coreRingMat);
coreRing.position.set(0, py(594), TORSO_FRONT + 0.04);
robot.add(coreRing);
const coreBall = new THREE.Mesh(new THREE.SphereGeometry(0.09, 28, 22), coreMat);
coreBall.position.set(0, py(594), TORSO_FRONT + 0.06);
robot.add(coreBall);

function limbTube(pts, radius, mat) {
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.08);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, 32, radius, 18, false), mat);
}

for (const side of [-1, 1]) {
  const armPts = side < 0
    ? cubicPts(382, 556, 350, 566, 334, 592, 330, 616)
    : cubicPts(518, 556, 550, 566, 566, 592, 570, 616);
  robot.add(limbTube(armPts, 0.15, matGlass));
  robot.add(limbTube(armPts, 0.014, softLine('#7fe7f2', 0.5)));

  const fingerData = side < 0
    ? [[322, 626, 312, 638, 320, 648], [333, 630, 327, 644, 335, 652], [344, 632, 342, 646, 352, 652]]
    : [[578, 626, 588, 638, 580, 648], [567, 630, 573, 644, 565, 652], [556, 632, 558, 646, 548, 652]];
  for (const f of fingerData)
    robot.add(limbTube(quadPts(f[0], f[1], f[2], f[3], f[4], f[5], 10), 0.024, cyanGlow));

  const legPts = side < 0
    ? cubicPts(424, 650, 418, 678, 412, 698, 406, 716)
    : cubicPts(476, 650, 482, 678, 488, 698, 494, 716);
  robot.add(limbTube(legPts, 0.19, matGlass));
  robot.add(limbTube(legPts, 0.016, softLine('#7fe7f2', 0.45)));

  const foot = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 36), matBody);
  foot.scale.set(0.34, 0.27, 0.30);
  foot.position.set(px(side < 0 ? 402 : 498), py(728), 0);
  robot.add(foot);
  const toe = tubeFromPoints(
    quadPts(side < 0 ? 376 : 472, 724, side < 0 ? 402 : 498, 740, side < 0 ? 428 : 524, 724, 10),
    0.014, softLine('#67e8f9', 0.5), false);
  toe.position.z = 0.26;
  robot.add(toe);
}

const haloTilt = new THREE.Group();
haloTilt.position.set(0, py(470), -1.7);
scene.add(haloTilt);

const ringOuterGroup = new THREE.Group();
ringOuterGroup.rotation.x = Math.acos(95 / 340);
haloTilt.add(ringOuterGroup);
const ringOuter = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.015, 10, 160), softLine('#67e8f9', 0.85));
ringOuterGroup.add(ringOuter);

const ringInnerGroup = new THREE.Group();
ringInnerGroup.rotation.x = Math.acos(78 / 298);
haloTilt.add(ringInnerGroup);
const ringInner = new THREE.Mesh(new THREE.TorusGeometry(2.98, 0.009, 8, 140), softLine('#67e8f9', 0.4));
ringInnerGroup.add(ringInner);

const dotAngles = [deg(19.7), deg(199.7), deg(-39.9), deg(140.1)];
for (const a of dotAngles) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.028, 16, 12), ringMat);
  d.position.set(Math.cos(a) * 3.4, Math.sin(a) * 3.4, 0);
  ringOuterGroup.add(d);
}
const orbit1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 16), glowMat('#c9f6ff', 2.6));
const orbit2 = new THREE.Mesh(new THREE.SphereGeometry(0.032, 18, 14), glowMat('#8be9f8', 2.2));
ringOuterGroup.add(orbit1, orbit2);

const groundMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uColor: { value: new THREE.Color('#67e8f9') }, uOpacity: { value: 0.6 } },
  vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'varying vec2 vUv;uniform vec3 uColor;uniform float uOpacity;void main(){float d=distance(vUv,vec2(.5))*2.;float a=pow(smoothstep(1.,0.,d),1.7);gl_FragColor=vec4(uColor,a*uOpacity);}'
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.8, 72), groundMat);
ground.scale.set(1, 0.1667, 1);
ground.rotation.x = -Math.PI / 2 + 0.5;
ground.position.y = py(812);
ground.renderOrder = 2;
scene.add(ground);

const particleData = [
  [140, 240, 3, 8, 3.2, 10, -22, -2, -1], [210, 150, 2.5, 7, 2.6, -8, -18, -4, -0.6],
  [760, 210, 3.5, 9, 3.8, 12, -26, -1, -2], [820, 420, 2.5, 6.5, 2.4, -10, -14, -3, -1.4],
  [700, 120, 2, 7.5, 3, 8, -20, -5, -0.2], [120, 520, 2.5, 8.5, 2.8, 10, -16, -2.6, -1.8],
  [90, 380, 2, 7, 3.4, -6, -24, -0.8, -2.4], [830, 600, 3, 9.5, 2.2, -12, -18, -4.4, -0.9],
  [740, 700, 2.5, 8, 3.6, 8, -22, -1.6, -2.8], [180, 700, 3, 7.5, 2.5, -10, -16, -3.4, -0.4],
  [300, 110, 2, 6.8, 3.1, 6, -18, -2.2, -1.2], [560, 90, 2.5, 8.2, 2.7, -8, -20, -5.6, -1.6],
  [660, 260, 2, 7.2, 3.3, 10, -14, -0.4, -2.2], [250, 300, 2, 6.6, 2.9, -6, -18, -4.8, -0.8],
  [620, 640, 2, 8.8, 2.3, 8, -16, -2.8, -1.9], [330, 760, 2.5, 7.8, 3.5, -10, -20, -1.2, -2.6]
];
const particles = particleData.map((p, i) => {
  const mat = glowMat('#9beef7', 1.8);
  mat.transparent = true;
  const m = new THREE.Mesh(new THREE.SphereGeometry(p[2] * S, 14, 10), mat);
  m.position.set(px(p[0]), py(p[1]), ((i % 5) - 2) * 0.5 + 0.35);
  scene.add(m);
  return { m, mat, x: px(p[0]), y: py(p[1]), d: p[3], tw: p[4], dx: p[5] * S, dy: p[6] * S, p1: p[7], p2: p[8] };
});

const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(-4, 6, 8);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x9beef7, 0.5);
rimLight.position.set(-6, 2, -6);
scene.add(rimLight);
const underLight = new THREE.PointLight(0x22d3ee, 6, 22, 2);
underLight.position.set(0, -2.6, 4.5);
scene.add(underLight);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.5, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const TAU = Math.PI * 2;
const breathe = (t, period, delay = 0) => 0.5 + 0.5 * Math.sin(TAU * (t - delay) / period - Math.PI / 2);

function animate(t) {
  robot.position.y = 0.16 * Math.sin(TAU * t / 4.6);
  headGroup.rotation.z = deg(2.6) * Math.sin(TAU * t / 6.4);
  haloTilt.rotation.z = -0.1396 + deg(2.2) * Math.sin(TAU * t / 9);
  leftEar.rotation.z = deg(3) * Math.sin(TAU * t / 5.5);
  dashRing.rotation.z = TAU * t / 22;

  const bEye = breathe(t, 3.4);
  dimEyeMat.emissiveIntensity = 0.25 + 0.75 * bEye;
  rimMat.emissiveIntensity = 1.3 * (0.5 + 0.5 * bEye);
  const bCore = breathe(t, 3.4, 0.5);
  coreRingMat.emissiveIntensity = 1.8 * (0.5 + 0.5 * bCore);
  coreMat.emissiveIntensity = 2.4 * (0.5 + 0.5 * bCore);

  const gp = breathe(t, 4.6);
  const gs = 1 - 0.12 * gp;
  ground.scale.set(gs, 0.1667 * gs, 1);
  groundMat.uniforms.uOpacity.value = 0.6 - 0.25 * gp;

  const a1 = TAU * t / 16, a2 = TAU * (t + 9) / 26;
  orbit1.position.set(Math.cos(a1) * 3.4, Math.sin(a1) * 3.4, 0);
  orbit2.position.set(Math.cos(a2) * 3.4, Math.sin(a2) * 3.4, 0);

  for (const p of particles) {
    const drift = Math.sin(TAU * t / p.d + p.p1);
    p.m.position.set(p.x + p.dx * drift, p.y + p.dy * drift, p.m.position.z);
    p.mat.opacity = 0.12 + 0.83 * (0.5 + 0.5 * Math.sin(TAU * t / p.tw + p.p2));
  }
}

function fitCamera() {
  const a = innerWidth / innerHeight;
  const fovV = Math.max(
    2 * Math.atan(4.5 / CAM_DIST),
    2 * Math.atan(3.9 / (CAM_DIST * a))
  );
  camera.fov = THREE.MathUtils.radToDeg(fovV);
  camera.aspect = a;
  camera.updateProjectionMatrix();
}
fitCamera();

let booted = false;
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const t = reduceMotion ? 0 : clock.getElapsedTime();
  controls.update();
  animate(t);
  composer.render();
  if (!booted) {
    booted = true;
    requestAnimationFrame(() => document.getElementById('boot').classList.add('hide'));
  }
}
tick();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  fitCamera();
});
</script>
</body>
</html>
