apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-assistant.fullname" . }}-backend
  labels:
    app: {{ include "k8s-assistant.name" . }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "k8s-assistant.name" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "k8s-assistant.name" . }}
        component: backend
    spec:
      serviceAccountName: "{{ include "k8s-assistant.serviceAccountName" . }}"
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.backend.targetPort | default 8000 }}
          envFrom:
            - configMapRef:
                name: {{ include "k8s-assistant.fullname" . }}-config
          env:
            # ------------------------------------------------------------------
            # 原有环境变量: Gemini AI 配置
            # ------------------------------------------------------------------
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: api-key
            - name: GEMINI_MODEL
              value: {{ .Values.env.GEMINI_MODEL | quote }}

            # ------------------------------------------------------------------
            # 新增环境变量: 告警 Webhook 配置
            # ------------------------------------------------------------------
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "k8s-assistant.fullname" . }}-config
                  key: alert-webhook-url
                  optional: true
            - name: ALERT_ENABLED
              value: {{ .Values.env.ALERT_ENABLED | default "true" | quote }}
            - name: ALERT_WEBHOOK_TIMEOUT
              value: {{ .Values.env.ALERT_WEBHOOK_TIMEOUT | default "10" | quote }}

            # ------------------------------------------------------------------
            # 新增环境变量: 告警过滤与冷却配置
            # ------------------------------------------------------------------
            - name: ALERT_COOLDOWN_SECONDS
              value: {{ .Values.env.ALERT_COOLDOWN_SECONDS | default "300" | quote }}
            - name: AGGREGATION_WINDOW_SECONDS
              value: {{ .Values.env.AGGREGATION_WINDOW_SECONDS | default "300" | quote }}

            # ------------------------------------------------------------------
            # 新增环境变量: 监控扫描配置
            # ------------------------------------------------------------------
            - name: MONITOR_SCAN_INTERVAL
              value: {{ .Values.env.MONITOR_SCAN_INTERVAL | default "60" | quote }}
            - name: MONITOR_NAMESPACES
              value: {{ .Values.env.MONITOR_NAMESPACES | default "" | quote }}

          # 资源限制（建议配置，防止 OOM）
          resources:
            requests:
              cpu: {{ .Values.resources.backend.requests.cpu | default "100m" }}
              memory: {{ .Values.resources.backend.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ .Values.resources.backend.limits.cpu | default "500m" }}
              memory: {{ .Values.resources.backend.limits.memory | default "256Mi" }}

          # 就绪探针（确保服务就绪后才接收流量）
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # 存活探针
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
